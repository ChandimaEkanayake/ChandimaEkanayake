<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Chandima Ekanayake, software engineer">
<defs>
<radialGradient id="b1"><stop offset="0" stop-color="#c2410c" stop-opacity=".13"/><stop offset=".7" stop-color="#c2410c" stop-opacity="0"/></radialGradient>
<radialGradient id="b2"><stop offset="0" stop-color="#c2410c" stop-opacity=".08"/><stop offset=".7" stop-color="#c2410c" stop-opacity="0"/></radialGradient>
<pattern id="d" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#ebe6e0"/></pattern>
<clipPath id="c"><rect width="1200" height="240" rx="18"/></clipPath>
</defs>
<style>
.s{font-family:ui-sans-serif,'Segoe UI',Helvetica,Arial,sans-serif}
@keyframes d1{0%{transform:translate(0,0) scale(1)}35%{transform:translate(-90px,40px) scale(1.18)}70%{transform:translate(-230px,10px) scale(.95)}100%{transform:translate(-140px,60px) scale(1.1)}}
@keyframes d2{0%{transform:translate(0,0) scale(1)}50%{transform:translate(160px,-30px) scale(1.15)}100%{transform:translate(70px,-50px) scale(.95)}}
.b1{animation:d1 18s ease-in-out infinite alternate}.b2{animation:d2 22s ease-in-out infinite alternate}
@media (prefers-reduced-motion:reduce){.b1,.b2{animation:none}}
</style>
<g clip-path="url(#c)">
<rect width="1200" height="240" fill="#f7f5f2"/>
<rect width="1200" height="240" fill="url(#d)"/>
<circle class="b1" cx="1020" cy="30" r="260" fill="url(#b1)"/>
<circle class="b2" cx="160" cy="250" r="230" fill="url(#b2)"/>
<text class="s" x="62" y="120" font-size="84" font-weight="600" letter-spacing="-2" fill="#1c1917">Chandima Ekanayake</text>
<text class="s" x="64" y="174" font-size="28" font-weight="700" fill="#57534e">Software Engineer</text>
<text class="s" x="64" y="212" font-size="26" font-style="italic" fill="#57534e">Calm, dependable systems.</text>
</g>
<rect x=".5" y=".5" width="1199" height="239" rx="17.5" fill="none" stroke="#e0dad3"/>
</svg>