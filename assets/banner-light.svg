<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Chandima Ekanayake, software engineer in Colombo, Sri Lanka">
<defs>
<radialGradient id="g" cx="82%" cy="30%" r="62%"><stop offset="0" stop-color="#c2410c" stop-opacity="0.22"/><stop offset="1" stop-color="#c2410c" stop-opacity="0"/></radialGradient>
<linearGradient id="r" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c2410c" stop-opacity="0"/><stop offset=".5" stop-color="#c2410c" stop-opacity=".9"/><stop offset="1" stop-color="#c2410c" stop-opacity="0"/></linearGradient>
<pattern id="d" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#e0dad3"/></pattern>
<clipPath id="c"><rect width="1200" height="280" rx="18"/></clipPath>
</defs>
<style>
.s{font-family:ui-sans-serif,'Segoe UI',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,'SFMono-Regular',Consolas,Menlo,monospace}
@keyframes sweep{0%{transform:translateX(-420px)}100%{transform:translateX(1620px)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.sw{animation:sweep 7s linear infinite}.cur{animation:blink 1.1s steps(1) infinite}.br{animation:breathe 4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.sw,.cur,.br{animation:none}.sw{display:none}}
</style>
<g clip-path="url(#c)">
<rect width="1200" height="280" fill="#f7f5f2"/>
<rect width="1200" height="280" fill="url(#d)"/>
<rect width="1200" height="280" fill="url(#g)"/>
<g fill="none" stroke="#c2410c" stroke-opacity=".28"><circle class="br" cx="1000" cy="84" r="64"/><circle cx="1000" cy="84" r="112" stroke-opacity=".16"/><circle cx="1000" cy="84" r="168" stroke-opacity=".09"/></g>
<circle class="br" cx="1000" cy="84" r="5" fill="#c2410c"/>
<rect class="sw" x="0" y="270" width="420" height="2" fill="url(#r)"/>
<text class="m" x="64" y="78" font-size="22" letter-spacing="2" fill="#c2410c">~/colombo $ whoami</text>
<text class="s" x="62" y="156" font-size="84" font-weight="600" letter-spacing="-2" fill="#1c1917">Chandima Ekanayake</text>
<text class="s" x="64" y="212" font-size="34" fill="#57534e">Software engineer. Calm, dependable systems.</text>
<text class="m" x="64" y="252" font-size="22" fill="#57534e">Java · TypeScript · AWS · AI agents<tspan class="cur" fill="#c2410c"> ▍</tspan></text>
</g>
<rect x=".5" y=".5" width="1199" height="279" rx="17.5" fill="none" stroke="#e0dad3"/>
</svg>